<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <title>Team Matrix — Event Countdown</title>

    <link rel="stylesheet" href="css/style.css"/>

  <style>
    body {
      background: #0a0f1f;
      color: var(--medium-gray);
      font-family: var(--primary-font);
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    /* Animated grid backdrop for dark theme */
    .grid-bg {
      position: fixed; inset: -200vmax;
      background:
        linear-gradient(transparent 95%, #1f2a44 0) 0 0/ 28px 28px,
        linear-gradient(90deg, transparent 95%, #1f2a44 0) 0 0/ 28px 28px;
      opacity: .18;
      transform: rotate(1deg) translateZ(0);
      animation: drift 30s linear infinite;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes drift { to { transform: rotate(1deg) translate3d(-28px, -28px, 0); } }
    .wrap {
      width: min(100%, 920px);
      padding: 24px;
      margin-top: 32px;
    }
    .brand {
      display: flex; align-items: center; gap: 14px; margin-bottom: 10px;
    }
    .logo {
      width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
      background: var(--base-color);
      box-shadow: 0 0 24px #97e14d55, inset 0 0 16px #0002;
      color: var(--white); font-weight: 900; letter-spacing: .5px;
    }
    h1 { margin: 0; font-size: clamp(20px, 3.6vw, 32px); font-weight: 800; font-family: var(--alt-font); color: var(--base-color); }
    .subtitle { color: var(--medium-gray); margin: 4px 0 20px; font-size: clamp(12px, 1.8vw, 15px); }
    .card {
      background: #181c2a;
      border: 1px solid #23262d;
      border-radius: 18px;
      box-shadow: 0 10px 40px #0006, 0 0 0 8px #97e14d11;
      padding: clamp(18px, 4vw, 28px);
      position: relative;
      overflow: hidden;
    }
    .eventline { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
    .badge {
      font-size: 12px; text-transform: uppercase; letter-spacing: .12em;
      padding: 6px 10px; border-radius: 999px; color: var(--white);
      background: var(--base-color);
      font-weight: 800;
    }
    .eventname { font-weight: 700; color: var(--base-color); }
    .eventdate { color: var(--medium-gray); }
    .timer {
      display: grid; grid-template-columns: repeat(4, minmax(90px, 1fr)); gap: clamp(10px, 2.4vw, 16px);
      margin-top: 16px; margin-bottom: 8px;
    }
    .cell {
    background: var(--slate-blue);
    border: 1px solid var(--extra-medium-gray);
    border-radius: 14px; padding: 16px; text-align: center;
    position: relative; isolation: isolate;
    }
    .value { font-size: clamp(28px, 5.5vw, 46px); 
        font-weight: 900; 
        letter-spacing: .02em; 
        color: var(--base-color); }
    .label { font-size: 12px; 
        text-transform: uppercase; 
        color: var(--medium-gray); 
        letter-spacing: .14em; }
    .progress {
      margin-top: 18px; height: 8px; background: var(--extra-medium-gray); border-radius: 999px; position: relative;
      overflow: hidden; border: 1px solid var(--extra-medium-gray);
    }
    .bar { height: 100%; width: 0%; background: var(--base-color); transition: width .6s ease; }
    .foot {
      display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; flex-wrap: wrap;
      color: var(--medium-gray);
    }
    .live {
      display: inline-flex; align-items: center; gap: 8px; color: #2ebb79; font-weight: 700;
      opacity: 0; transform: translateY(6px); transition: .35s ease;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #2ebb79; box-shadow: 0 0 12px #2ebb79; animation: pulse 1.3s infinite ease-in-out; }
    @keyframes pulse { 0%,100%{ transform: scale(1);} 50%{ transform: scale(1.3);} }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
    @media (max-width: 560px) {
      .timer { grid-template-columns: repeat(2, 1fr); }
      .foot { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <main class="wrap">
    <div class="brand">
      <div class="logo" aria-hidden="true">Logo</div>
      <div>
        <h1>CyberOn '25</h1>
      </div>
    </div>

    <section class="card" role="region" aria-label="Event countdown">
      <div class="eventline">
        <span class="eventname" id="eventName"></span>
        <span class="eventdate" id="eventWhen">— </span>
      </div>

      <div class="timer" aria-live="polite">
        <div class="cell"><div class="value" id="days">00</div><div class="label">Days</div></div>
        <div class="cell"><div class="value" id="hours">00</div><div class="label">Hours</div></div>
        <div class="cell"><div class="value" id="mins">00</div><div class="label">Minutes</div></div>
        <div class="cell"><div class="value" id="secs">00</div><div class="label">Seconds</div></div>
      </div>

      <div class="progress" aria-hidden="true"><div class="bar" id="bar"></div></div>

      <div class="foot">
        <div class="live" id="liveFlag"><span class="dot"></span>We are live!</div>
      </div>

      <p class="sr-only" id="srText">Countdown running</p>
    </section>
  </main>

  <script>
    // ======== CONFIG ========
    // Edit these two values to set your event.
    const EVENT_NAME = (new URLSearchParams(location.search).get('name')) || 'CyberOn 2025';
    // ISO 8601 date string. Example below: 18 Oct 2025, 10:00 IST (UTC+05:30)
    const EVENT_TIME_ISO = (new URLSearchParams(location.search).get('at')) || '2025-09-27T10:00:00+05:30';

    // ======== UTIL ========
    const el = id => document.getElementById(id);
    const fmt = n => String(Math.max(0, Math.floor(n))).padStart(2, '0');

    // Setup content
    document.title = `${EVENT_NAME} — Countdown`;
    el('eventName').textContent = EVENT_NAME;
    const eventDate = new Date(EVENT_TIME_ISO);

    // Friendly date text with timezone
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const long = new Intl.DateTimeFormat(undefined, { dateStyle: 'full', timeStyle: 'short' }).format(eventDate);
    el('eventWhen').textContent = `— ${long}`;

  // For progress bar: compute from a fixed start date (e.g., event announcement)
  // Change this to your event announcement date for a meaningful progress bar
  const START_DATE_ISO = (new URLSearchParams(location.search).get('start')) || new Date().toISOString().slice(0,10) + 'T00:00:00';
  const startBaseline = new Date(START_DATE_ISO);

    let tickHandle = null;
    function tick() {
      const now = new Date();
      const diffMs = eventDate - now;

      if (diffMs <= 0) {
        // Event live
        clearInterval(tickHandle);
        el('days').textContent = '00';
        el('hours').textContent = '00';
        el('mins').textContent = '00';
        el('secs').textContent = '00';
        el('liveFlag').style.opacity = 1;
        el('liveFlag').style.transform = 'translateY(0)';
        el('srText').textContent = 'Event is live!';
        document.title = `${EVENT_NAME} — LIVE`;
        el('bar').style.width = '100%';
        return;
      }

      const sec = diffMs / 1000;
      const days = Math.floor(sec / 86400);
      const hours = Math.floor((sec % 86400) / 3600);
      const mins = Math.floor((sec % 3600) / 60);
      const secs = Math.floor(sec % 60);

      el('days').textContent = fmt(days);
      el('hours').textContent = fmt(hours);
      el('mins').textContent = fmt(mins);
      el('secs').textContent = fmt(secs);

  // progress: from today to event time
  const nowMs = Date.now();
  const total = eventDate - startBaseline;
  const done = nowMs - startBaseline.getTime();
  const pct = Math.min(100, Math.max(0, (done / total) * 100));
  el('bar').style.width = pct + '%';

      document.title = `${fmt(days)}d ${fmt(hours)}h ${fmt(mins)}m — ${EVENT_NAME}`;
    }

    // Start ticking
    tick();
    tickHandle = setInterval(tick, 1000);
  </script>
</body>
</html>
